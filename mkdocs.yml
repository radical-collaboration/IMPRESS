site_name: IMPRESS
site_description: Intelligent Multi-Pipeline Protein Engineering System for HPC
site_author: IMPRESS Team
site_url: https://radical-collaboration.github.io/IMPRESS/

repo_name: radical-collaboration/IMPRESS
repo_url: https://github.com/radical-collaboration/IMPRESS
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Build A Protein Pipeline: getting-started/quick-start.md
  - Concepts:
    - Architecture: concepts/architecture.md
    - Adaptive Execution: concepts/adaptive-execution.md
  - Examples:
    - Protein Binding: examples/protein-binding.md
    - Discontinuous Scaffolds: examples/discontinuous-scaffolds.md
    - Small Molecule Binding: examples/small-molecule-binding.md
    - Agentic Small Molecule Binding: examples/agentic-small-molecule-binding.md
  - API Reference:
    - Overview: reference/index.md
    - ImpressManager: reference/manager.md
    - ImpressBasePipeline: reference/pipeline.md
    - PipelineSetup: reference/setup.md
    - ImpressLogger: reference/logger.md
  # IMPRESS-A (agent/). Note this is hand-written prose, unlike "API Reference"
  # above, which mkdocstrings generates from src/impress docstrings - the two trees
  # used to share the name `reference/` and this namespacing is what separates them.
  - IMPRESS-A:
    - Architecture: impress-a/reference/architecture.md
    - Pluggable Frontends: impress-a/reference/frontends.md
    - Compute Patterns: impress-a/reference/compute-patterns.md
    - Authoring Tools: impress-a/reference/authoring-tools.md
    - Middleware Integration: impress-a/reference/middleware-integration.md
    - Limitations: impress-a/limitations.md
    - Decisions:
      - Overview: impress-a/decisions/index.md
      - 0001 IMPRESS is a tool, not the control plane: impress-a/decisions/0001-impress-is-a-tool-not-the-control-plane.md
      - 0002 Control model C is control mode 2: impress-a/decisions/0002-model-c-is-control-mode-2.md
      - 0003 Free graph composition with a self-promoting interlock: impress-a/decisions/0003-free-graph-composition-with-self-promoting-interlock.md
      - 0004 Population Pareto front with backtracking: impress-a/decisions/0004-population-pareto-front-with-backtracking.md
      - 0005 The control model is fixed at launch: impress-a/decisions/0005-control-model-fixed-at-launch.md
      - 0006 Task agents are hybrid, declared per tool: impress-a/decisions/0006-hybrid-task-agents.md
      - 0007 One transport-agnostic control plane: impress-a/decisions/0007-transport-agnostic-control-plane.md
      - 0008 Platform priority: impress-a/decisions/0008-platform-priority.md
      - 0009 Package naming: impress-a/decisions/0009-package-naming.md
      - 0010 One package with an import contract: impress-a/decisions/0010-single-package-with-import-contract.md
      - 0011 Toolkits are top-level and declarative: impress-a/decisions/0011-toolkits-are-top-level-and-declarative.md
      - 0012 One property, two sources: impress-a/decisions/0012-one-property-two-sources.md
      - 0013 Trust counts integrity, not acceptance: impress-a/decisions/0013-trust-counts-integrity-not-acceptance.md
    - Roadmap:
      - Academy for task agents: impress-a/roadmap/academy-for-task-agents.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radical-collaboration/IMPRESS
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/impress-framework/

