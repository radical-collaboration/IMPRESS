[tox]
envlist = py39,py310,py311,py312,py313,agent-py310,agent-py311,agent-py312,agent-py313
isolated_build = true

# Unit test env
[testenv]
extras = dev
commands = pytest tests/unit {posargs}

# Integration test radical.pilot
[testenv:{py39,py310,py311,py312,py313}-all]
extras = dev
setenv =
    RADICAL_VERBOSE=DEBUG
commands_pre = 
    radical-stack
commands = pytest tests/integration {posargs}

# IMPRESS-A (agent/), the second package in this repository. One entry point for both,
# two environments - which is the whole trick, and the reason this is not simply another
# leg of [testenv] above.
#
# `skip_install` plus an explicit `deps` is what keeps the dependency firewall commit
# b7b4bc0 built the separate CI job for: the root package and its `radical.pilot` never
# enter these environments, and `radical-asyncflow` resolves against agent/'s own
# `>=0.5.1` rather than root's `>=0.4.0`. Installing both projects into one environment
# would silently raise root's floor and put langgraph, rhapsody and biopython in front of
# every root test.
#
# No py39 leg, by construction: impress-a declares `requires-python = ">=3.10"`. py313 IS
# here, and was not in the workflow this replaces - agent/ was tested on 3.10-3.12 while
# root was tested on 3.9-3.13, so the newest interpreter root supports was one nothing
# ever ran impress_a on.
#
# `deps` is resolved against the tox root (this file's directory), NOT against
# `changedir` - so it is `./agent[dev]` and not `.[dev]`, which would try to install the
# root package from inside agent/. `changedir` applies to `commands`, which is what puts
# pytest's rootdir on agent/pyproject.toml and its own [tool.pytest.ini_options].
[testenv:agent-py{310,311,312,313}]
skip_install = true
deps = ./agent[dev]
changedir = agent
commands = pytest tests {posargs}

# Linting - BOTH projects. agent/ had no lint gate at all until this covered it:
# agent-tests.yml ran only pytest, and `ruff check src tests` resolves from here to
# src/impress and these tests/, so 65 files went unchecked while the stated ceiling in
# agent/plans/backlog.md was measured against a different configuration entirely.
#
# `ruff format --check` stays on src and tests. agent/ has never been ruff-formatted, and
# adopting it there is 4711 lines across 57 of its 65 files - a separate decision, with
# its own price, that would not even clear the E501s it is being asked to fix (ruff format
# does not reflow comments or docstrings). Widen this line only with that in hand.
[testenv:lint]
extras = lint
commands =
    ruff check src tests agent/src agent/tests
    ruff format --check src tests

# Formatting. Note the asymmetry is the same as above and for the same reason: fixes go
# everywhere, reformatting only where reformatting is already the contract.
[testenv:format]
extras = lint
commands =
    ruff format src tests
    ruff check --fix src tests agent/src agent/tests

# Coverage
[testenv:coverage]
extras = dev
commands = pytest --cov=impress --cov-report=html --cov-report=term {posargs}
