[tox]
envlist = py39,py310,py311,py312,py313
isolated_build = true

# Unit test env
[testenv]
extras = dev
commands = pytest tests/unit {posargs}

# Integration test radical.pilot
[testenv:{py39,py310,py311,py312,py313}-all]
extras = dev
setenv =
    RADICAL_VERBOSE=DEBUG
commands_pre = 
    radical-stack
commands = pytest tests/integration {posargs}

# Linting - BOTH projects. agent/ had no lint gate at all until this covered it:
# agent-tests.yml ran only pytest, and `ruff check src tests` resolves from here to
# src/impress and these tests/, so 65 files went unchecked while the stated ceiling in
# agent/plans/backlog.md was measured against a different configuration entirely.
#
# `ruff format --check` stays on src and tests. agent/ has never been ruff-formatted, and
# adopting it there is 4711 lines across 57 of its 65 files - a separate decision, with
# its own price, that would not even clear the E501s it is being asked to fix (ruff format
# does not reflow comments or docstrings). Widen this line only with that in hand.
[testenv:lint]
extras = lint
commands =
    ruff check src tests agent/src agent/tests
    ruff format --check src tests

# Formatting. Note the asymmetry is the same as above and for the same reason: fixes go
# everywhere, reformatting only where reformatting is already the contract.
[testenv:format]
extras = lint
commands =
    ruff format src tests
    ruff check --fix src tests agent/src agent/tests

# Coverage
[testenv:coverage]
extras = dev
commands = pytest --cov=impress --cov-report=html --cov-report=term {posargs}
