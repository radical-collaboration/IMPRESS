[tox]
envlist = py39,py310,py311,py312,py313
isolated_build = true

# Unit test env
[testenv]
extras = dev
commands = pytest tests/unit {posargs}

# Integration test radical.pilot
[testenv:{py39,py310,py311,py312,py313}-all]
extras = dev
setenv =
    RADICAL_VERBOSE=DEBUG
commands_pre = 
    radical-stack
commands = pytest tests/integration {posargs}

# Linting - BOTH projects, one entry point, two contracts.
#
# `ruff check` resolves its configuration PER FILE, walking up from each file to the nearest
# pyproject.toml carrying a [tool.ruff] table. So this one command checks `impress` under
# the root table (line-length 88, py39) and `impress_a` under agent/pyproject.toml's own
# (line-length 100, py310, N818 declined), and neither project has to adopt the other's
# width. That is also why `--config` must never appear here: forcing the root table onto
# agent/ reports 4372 findings, 4340 of them E501.
#
# `ruff format --check` deliberately stays on src and tests. agent/ has never been
# ruff-formatted and adopting it there is a separate decision with its own price:
# `ruff format --check agent/src agent/tests` wants to rewrite 102 of its files, and it
# would not even clear the E501s it would be asked to fix, because ruff format reflows code
# and never comments or docstring prose. Widen this line only with that in hand.
#
# `examples/colab` is checked but not format-checked, for the same reason agent/ is not.
# It is the only part of `examples/` that is linted at all: the rest predates the zero
# ceiling and `ruff check examples` reports findings in files nobody is touching. A helper
# that readers are pointed at from the documentation holds the contract the rest of the
# repository holds; widen this to the whole of `examples/` only with those findings fixed.
#
# No `extras = lint`: ruff reads files and needs nothing installed, and installing this
# project here would pull radical.pilot into a job that never imports it.
[testenv:lint]
skip_install = true
# Pinned deliberately; the reason is in pyproject.toml beside the `lint` extra, which carries
# the same pin. codespell is here rather than in its own env because it is a lint check and
# this env already installs nothing: both tools read files.
deps =
    ruff>=0.17,<0.18
    # The `toml` extra is load-bearing: without it codespell cannot read [tool.codespell]
    # from pyproject.toml on Python < 3.11, so the ignore list is silently not applied and
    # the three domain words below come back as findings.
    codespell[toml]>=2.3
commands =
    ruff check src tests agent/src agent/tests examples/colab
    ruff format --check src tests
    # [tool.codespell] in pyproject.toml carries the ignore list and why each word is on it.
    # Explicit paths rather than a bare `codespell`, which would walk .venv and site/.
    codespell src tests agent/src agent/tests examples/colab docs

# Formatting. The asymmetry is the same as above and for the same reason: fixes go to both
# projects, reformatting only where reformatting is already the contract.
[testenv:format]
skip_install = true
deps = ruff>=0.17,<0.18
commands =
    ruff format src tests
    ruff check --fix src tests agent/src agent/tests examples/colab

# Docs. Builds the site, then fails on a broken internal link or a missing nav target.
#
# NOT `mkdocs build --strict`. Strict escalates EVERY warning, and this build currently
# emits 46 of them from griffe - "No type or annotation for parameter ..." against
# src/impress/utils/logger.py and src/impress/pipelines/impress_pipeline.py. Those are real
# documentation gaps, but none of the 46 is about a link or a nav entry, so gating on them
# would keep the docs job red for reasons unrelated to the documentation being correct.
#
# scripts/check_docs_links.py takes the half of --strict this repository can hold today.
# Delete it and restore --strict once those two modules are annotated.
[testenv:docs]
extras = doc
commands =
    mkdocs build --site-dir {envtmpdir}/site
    python scripts/check_docs_links.py

# The two Colab notebooks under docs/notebooks/, executed headlessly.
#
# They are committed WITH their outputs, because the documentation site renders them
# statically for readers who never open Colab. That makes them the one part of the
# documentation that can rot into a lie without anyone touching it: an upstream change
# breaks the code while the committed output still shows it working. This env re-runs them.
#
# `skip_install` with an explicit two-step `commands_pre`, because the notebooks exercise
# BOTH packages and the install order is load-bearing. `impress` is on no index, so it has
# to be editable-installed before pip resolves `impress-a`'s dependencies - otherwise pip
# goes to PyPI for the name and installs whatever it finds. Same order and same reason as
# ci.yml's agent-tests job, which is not tox-driven for exactly this.
#
# `--no-deps` on the root install skips radical.pilot, which `impress` declares and never
# imports; the agent install brings radical.asyncflow in anyway.
#
# The notebooks guard their own install cells on `find_spec`, so they no-op here rather
# than cloning the repository into the documentation tree. IMPRESS_NB_SMALL is what keeps
# the run inside a couple of minutes; it shrinks the configuration, not the code path.
#
# basepython tracks the Python that Google Colab ships, since that is the environment the
# notebooks promise to work in. Move it when Colab moves.
[testenv:notebooks]
skip_install = true
basepython = python3.12
setenv =
    IMPRESS_NB_SMALL = 1
    MPLBACKEND = Agg
deps =
    pytest
    # The project's pytest config sets asyncio_mode; without the plugin installed
    # pytest warns about an unknown option on every run of this env.
    pytest-asyncio
    nbmake
commands_pre =
    pip install -e . --no-deps
    pip install -e ./agent[figures]
commands =
    pytest --nbmake -p no:cacheprovider {posargs:docs/notebooks}

# Coverage
[testenv:coverage]
extras = dev
commands = pytest --cov=impress --cov-report=html --cov-report=term {posargs}
