id: packmin
toolkit: rosetta
version: "0.1"
pattern: P2
entry: impress_a.tools.rosetta_agents.PackMinAgent
resources: {cores: 4, walltime_s: 300}
inputs:
  structure: {type: Complex}
outputs:
  structure: {type: Complex}
parameters:
  cycles: {type: int, default: 1, min: 1, max: 5, trades: "convergence vs cpu-hours"}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
  # Path to a Rosetta ligand .params file, passed to pyrosetta.init() as -extra_res_fa.
  # Without it, pose_from_pdb() on a PDB containing a non-standard ligand HETATM residue
  # will raise (confirmed: old IMPRESS's packmin.py always passes this).
  ligand_params_path: {type: str, default: ""}
metrics: [total_score]
qc_gates:
  - {id: output_present, params: {key: result}}
  # No threshold on packmin's own score. Whether a pose blew up is judged one stage later,
  # by whether fastrelax CONVERGES (its integrity gates: total_score <= 0, fa_rep <= 500) -
  # which is where the reference pipeline gates too (small_molecule_binding.py:678), with
  # nothing on packmin. packmin is PackRotamersMover + MinMover with no constraints: it
  # prepares a pose for relaxation, and its score says how much relaxing is left to do.
  #
  # History, because both earlier bounds were wrong in the same way. `max: 0.0` was
  # upstream's fastrelax threshold on the wrong stage (job 22684607: +145.3 here, -322.6
  # from fastrelax on the same structure). `max: 1000.0` replaced it, one observation wide,
  # and its first real trip was a false alarm: job 22726105 r0004 scored +1064.5 here and
  # relaxed normally to -336.0 with fa_rep 119.1 - and because this gate was integrity,
  # it demoted a trusted pattern that had done nothing wrong. Ten real packmin scores span
  # -7.6 to +1064.5, all of them relaxed. A bound inside the normal spread of a pre-relax
  # score carries no information about breakage.
  #
  # What stays: the score must be REPORTED. A worker that exits without one has broken.
  - {id: metrics_reported, params: {metrics: [total_score]}}
# COST IS CPU-HOURS, WHICH IS WALL x CORES - and this figure was computed as wall alone.
# That is a units error, not a stale measurement, and it ran through every cpu_hours tool in
# this toolkit: each comment divided seconds by 3600, called the result cpu_hours, and then
# multiplied by a headroom factor that was therefore 4x smaller than it looked. The
# executor measures the ratio the right way, so `impress-a validate-tasks` on job 23670171
# failed fastrelax at measured/declared = 2.38 - a declared figure BELOW measurement, which
# is the direction that makes gate 5 and the untrusted-pattern cap refuse work that fits.
# Measured: 14.6s x 4 cores = 0.0162 cpu-h (job 23670171). Declared 0.06 = 3.7x.
# Not a failing row - it measured 0.81, inside the bound. Corrected anyway,
# because it is the SAME units error and 1.14x of real headroom means the next
# slower task fails validation and blocks the smoke again.
cost_model: {unit: invocation, cost: {cpu_hours: 0.06}}
