id: filter_shape
toolkit: rosetta
version: "0.1"
pattern: P2
entry: impress_a.tools.rosetta_agents.FilterShapeAgent
resources: {cores: 2, walltime_s: 120}
inputs:
  structure: {type: Complex}
outputs:
  structure: {type: Complex}
parameters:
  # Path to a Rosetta ligand .params file, passed to pyrosetta.init() as -extra_res_fa.
  # Without it, pose_from_pdb() on a PDB containing a non-standard ligand HETATM residue
  # will raise (confirmed: old IMPRESS's filter_shape.py always passes this, plus
  # -ignore_unrecognized_res -ignore_zero_occupancy).
  ligand_params_path: {type: str, default: ""}
# `sc_selector_mode` records WHICH interface the number came from (backlog G5):
#   0.0  the historical `jump="1"` filter - a shape complementarity across whatever jump 1
#        happened to be, which is the protein-ligand interface only by luck of chain order
#   1.0  the ligand residue property against its complement, which is correct whatever the
#        chain layout is
# Every number this project recorded before phase 10 is mode 0.0, so a figure from before and
# a figure from after are not comparable and this is what says so. Declared and reported rather than logged, so one
# real run settles it from provenance and so two campaigns' numbers cannot be compared without
# noticing that they measured different things. Not gated - it is provenance, not quality.
metrics: [shape_complementarity, sc_selector_mode]
# Integrity gates say the tool worked; acceptance gates say the design is good enough.
# Only integrity failures reset trust (docs/decisions/0013). Each acceptance threshold is
# backed by `metrics_reported`, so a value the adapter could not read is an integrity
# failure, never a low score.
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported,
     params: {metrics: [shape_complementarity, sc_selector_mode]}}
  - {id: metric_in_range, role: acceptance,
     params: {metric: shape_complementarity, min: 0.55, max: 1.0}}
# COST IS CPU-HOURS, WHICH IS WALL x CORES - and this figure was computed as wall alone.
# That is a units error, not a stale measurement, and it ran through every cpu_hours tool in
# this toolkit: each comment divided seconds by 3600, called the result cpu_hours, and then
# multiplied by a headroom factor that was therefore 2x smaller than it looked. The
# executor measures the ratio the right way, so `impress-a validate-tasks` on job 23670171
# failed fastrelax at measured/declared = 2.38 - a declared figure BELOW measurement, which
# is the direction that makes gate 5 and the untrusted-pattern cap refuse work that fits.
# Measured: never executed before job 23670171 - the XML route refused to build. Declared 0.01 = unverified.
# LEFT AT 0.01 and deliberately not adjusted: this tool has still never produced
# a cost measurement, so there is nothing to derive a figure from. A local probe
# put the SC computation at a few seconds, which at 2 cores leaves this roughly
# 3-4x - but that is an estimate, and the re-run is what will say. If it comes
# back over 1.0, raise it from THAT measurement.
cost_model: {unit: invocation, cost: {cpu_hours: 0.01}}
