id: rfd3_design
toolkit: rfd3
version: "0.1"
pattern: P1
entry: impress_a.tools.rfd3_agents.RFD3DesignAgent
resources: {gpus: 1, cores: 8, walltime_s: 900}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
outputs:
  backbone: {type: Backbone}
parameters:
  # STAYS AT 1, and this is the one tool here where that is still the honest setting.
  #
  # LigandMPNN and Boltz now select the best member of their own ensemble, so raising their
  # sampling pays. rfd3's adapter still keeps `cif_models[0]`, and selecting among its designs
  # needs the sidecar `*_model_*.json`'s metric NAMES confirmed against a real out_dir -
  # backlog G2's remaining half. Until that is read on hardware, raising this would pay N times
  # for one design, which is what the old comment here described as a design principle.
  #
  # Not listed in `frozen_parameters`, and the reason is worth recording: `ToolSpec` refuses a
  # name that is both varyable and frozen, so freezing it means REMOVING the parameter - which
  # changes what the adapter reads, and the adapter is the part that cannot be exercised
  # without a GPU. A default and a stated reason, rather than a gate built on an unverifiable
  # change.
  num_designs: {type: int, default: 1, min: 1, max: 64, trades: "coverage vs GPU-hours"}
  diffusion_steps: {type: int, default: 50, min: 20, max: 200, trades: "quality vs wall-clock"}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
  # Path to a real RFD3 `inputs=` JSON (a `DesignInputSpecification`: input PDB, contig,
  # ligand, select_exposed/select_buried, ...). RFD3 has no scaffold/guidance CLI override
  # - guided vs. unguided diffusion is selected entirely by WHICH file this points at,
  # never by a flag - so this is target identity, campaign-supplied, not composer-tuned.
  # See toolkits/rfd3/SKILL.md.
  input_spec_path: {type: str, default: ""}
# `ca_deviation`, `ligand_clashes`, `helix_fraction` and `sheet_fraction` come from the
# sidecar `*_model_*.json` the adapter selects each candidate by and, until phase 10, read
# nothing from (backlog G2's remaining half). Declared so a reasoner can see them and so the
# campaign records them; see `rfd3_agents.SIDECAR_KEYS` for why **nothing gates on them yet**:
# the key names are inferred rather than observed, an acceptance gate needs an integrity
# `metrics_reported` partner, and a partner naming a wrong key would fail every real run as an
# INTEGRITY failure - refusing the chain and demoting the pattern on a guess. Backlog A3 is the
# standing lesson about flags nobody has run. The gates land when one real out_dir confirms the
# names, which the adapter logs.
metrics: [ss_fraction, num_models, ca_deviation, ligand_clashes,
          helix_fraction, sheet_fraction]
qc_gates:
  - {id: output_present, params: {key: result}}
  # The integrity floor: a design with no secondary structure is a noodle, whatever else it
  # scores. Stays at 0.3 and stays integrity - it is a "the tool produced nothing usable"
  # check, not a quality threshold.
  - {id: has_secondary_structure, params: {min_ss_fraction: 0.3}}
  - {id: metrics_reported, params: {metrics: [ss_fraction, num_models]}}
  # Acceptance (backlog G4): upstream's `PROD` requires a designed backbone to be mostly
  # structured, not merely not-a-noodle. 0.5 is the reference's own floor for a backbone it
  # will spend an MPNN pass on.
  - {id: metric_in_range, role: acceptance, params: {metric: ss_fraction, min: 0.5}}
# Measured on job 22684607 (NVMe, 1 node): 145.7s = 0.0405 h. Declared 0.25 was
# 6x that - a literature guess, and on the gpu dimension those guesses summed
# past the interlock's 10%-of-budget cap and got boltz_predict truncated off the chain.
# 0.1 keeps ~2x headroom: one run is one sample, and this figure feeds a gate
# that REFUSES graphs, so it should err high - just not by two orders of magnitude.
cost_model: {unit: invocation, cost: {gpu_hours: 0.1}}
