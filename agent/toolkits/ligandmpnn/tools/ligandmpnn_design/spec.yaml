id: ligandmpnn_design
toolkit: ligandmpnn
version: "0.1"
pattern: P1
entry: impress_a.tools.ligandmpnn_agents.LigandMPNNDesignAgent
# walltime_s is 6x the MEASURED import cost, not a guess. Job 22669509: task.000002
# went RUNNING at 23:09:51 and FAILED at 23:14:27 - 276s to reach a ModuleNotFoundError
# in run.py's module-level imports, before one tensor was allocated. ~280s of that is
# `import torch` paging 1.6 GB of shared objects off Lustre; measured again on a login
# node at ~360s wall for 9s of CPU. At the old 300s this tool could not have finished
# importing, and would have failed as `timed out after 300s` - indistinguishable from a
# hang, and blamed on LigandMPNN rather than on this number.
resources: {gpus: 1, cores: 4, walltime_s: 1800}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  backbone: {type: Backbone}
outputs:
  structure: {type: Complex}
parameters:
  temperature: {type: float, default: 0.2, min: 0.0, max: 1.0, trades: "diversity vs recovery"}
  # Internal sampling, and the one tool here that offers two ways to do it. `batch_size` is
  # candidates per forward pass; `number_of_batches` is passes. One WIDE batch beats several
  # narrow ones for a model tuned for batched output - N serial batches of one is linear in N
  # where a single batch of N is close to sublinear - so the width goes here and the pass
  # count stays at 1.
  #
  # Raising these only pays because the adapter now SELECTS the best candidate: real
  # LigandMPNN writes every candidate for a design into one `.fa`, and the parser used to read
  # the first header and ignore the rest. See src/impress_a/tools/_ensemble.py.
  batch_size: {type: int, default: 8, min: 1, max: 64,
               trades: "candidates per pass; wider is near-free on a GPU until memory"}
  number_of_batches: {type: int, default: 1, min: 1, max: 16,
                      trades: "serial passes; linear in time, so prefer batch_size"}
  # Retained so a campaign that set it still loads, and as the figure the two above multiply
  # to. No longer passed to the CLI.
  num_seqs: {type: int, default: 1, min: 1, max: 64}
  pack_side_chains: {type: bool, default: true}
  # Space-separated residue indices to hold fixed, e.g. "A16" - passed straight through to
  # LigandMPNN's own `--fixed_residues` flag (confirmed real: `run.py --help`).
  fixed_residues: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
# `ensemble_size` and `ensemble_paired` are reported by the ADAPTER rather than by the tool:
# how many candidates it chose from, and whether it could pair the chosen one with its own
# packed structure. `ensemble_paired: 0` means it kept index 0 because the two file sets could
# not be matched one-to-one - visible rather than silent, because selecting from a mismatched
# pair is the failure _ensemble.py exists to prevent.
metrics: [overall_confidence, ligand_confidence, ensemble_size, ensemble_paired]
# Integrity gates say the tool worked; acceptance gates say the design is good enough.
# Only integrity failures reset trust (docs/impress-a/decisions/0013-trust-counts-integrity-not-acceptance.md). Each acceptance threshold is
# backed by `metrics_reported`, so a value the adapter could not read is an integrity
# failure, never a low score.
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [overall_confidence, ligand_confidence]}}
  - {id: metric_in_range, role: acceptance, params: {metric: overall_confidence, min: 0.4}}
  - {id: metric_in_range, role: acceptance, params: {metric: ligand_confidence, min: 0.4}}
# Measured on job 22684607 (NVMe, 1 node): 18.1s = 0.0050 h. Declared 0.25 was
# 50x that - a literature guess, and on the gpu dimension those guesses summed
# past the interlock's 10%-of-budget cap and got boltz_predict truncated off the chain.
# 0.02 keeps ~4x headroom: one run is one sample, and this figure feeds a gate
# that REFUSES graphs, so it should err high - just not by two orders of magnitude.
cost_model: {unit: invocation, cost: {gpu_hours: 0.02}}
