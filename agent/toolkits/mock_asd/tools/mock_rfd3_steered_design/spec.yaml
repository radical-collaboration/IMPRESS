# Twin of `rfd3_steered_design` (item 12b, EI.9). `mock_` on the id so it cannot collide with
# the real tool and disable its whole toolkit; `toolkit: mock` in the FIELD because gate 6
# matches that against "mock" exactly and a twin declaring `toolkit: mock_asd` would be
# classified real. Both rules have bitten this project once each.
id: mock_rfd3_steered_design
toolkit: mock
version: "0.1"
# P2 where the real tool is P1, and this is the ONE place a twin deliberately diverges: the
# real tool drives RFD3's denoiser on a GPU, and the twin returns seeded draws. A twin
# declaring `gpus: 1` would make a laptop campaign request a device nothing uses, and on a
# GPU-less node the task is accepted and never placed. The difference is recorded here rather
# than discovered in a run, and `tests/test_tier1_loop.py` asserts it is the only divergence.
pattern: P2
entry: asteer.impress.mock_asd.MockRFD3SteeredDesignAgent
resources: {cores: 2, walltime_s: 60}
inputs:
  anchor_spec: {type: Parameterized}
outputs:
  backbone: {type: Backbone}
parameters:
  # The real spec's parameters, name for name, so a campaign YAML that passes the twin passes
  # the tool. `input_spec_path` is read by the twin only to the extent of rendering the input
  # spec -- which is REAL code, shared with the tool, because the rendering is the half that
  # runs off-cluster.
  input_spec_path: {type: str, default: "", trades: "the real spec's parameter"}
  n_particles: {type: int, default: 8, min: 2, max: 50,
                trades: "the real spec's parameter: the SMC population"}
  n_restarts: {type: int, default: 3, min: 1, max: 12,
               trades: "the real spec's parameter"}
  partial_t: {type: float, default: 0.4, min: 0.05, max: 0.95,
              trades: "the real spec's parameter"}
  fk_potential: {type: str, default: "immediate",
                 trades: "the real spec's parameter; the four are not interchangeable"}
  fk_tau: {type: float, default: 1.0, min: 0.01, max: 100.0,
           trades: "the real spec's parameter: lambda = 1/tau"}
  ess_collapse_threshold: {type: float, default: 2.0, min: 0.01, max: 50.0,
                           trades: "the real spec's parameter, an absolute particle count"}
  buried_threshold: {type: float, default: 0.3, min: 0.0, max: 1.0,
                     trades: "the real spec's parameter"}
  emit_cfg_features: {type: bool, default: false,
                      trades: "the real spec's parameter; off because the keys are unverified"}
  tier: {type: int, default: 1, min: 1, max: 2,
         trades: "the real spec's parameter; the twin renders the tier-2 sampler key but
                  resamples between passes either way, because per-timestep resampling needs
                  a denoiser and the twin has none"}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
  # MOCK-ONLY. The reward the fake scorer draws around. Raising `reward_spread` sharpens the
  # weights and so lowers ESS -- which is how a laptop campaign reaches the collapse signal
  # without a GPU, and the reason this dial exists rather than a `force_collapse` flag.
  reward_spread: {type: float, default: 0.3, min: 0.0, max: 5.0,
                  trades: "mock only: how unequal the particle rewards are, hence how low ESS
                           falls and whether the collapse signal fires"}
  # MOCK-ONLY, AND IT IS `mock_rfd3_design`'S OWN DIAL, NAME FOR NAME (EI.31, item 43). The
  # slope is set so the twin reports the SAME `ss_fraction` at this default as
  # `mock_rfd3_design` reports at its own defaults -- 0.60 -- because that value is what the
  # whole mock chain is calibrated around: `mock_mpnn_design` inherits it, and the chain is a
  # product of slopes, so a steered head reporting nothing cost `complex_plddt` about 0.05
  # against a bar it had to clear (measured, EI.25).
  #
  # Like upstream's, it separates the two gate roles on one metric (decision 0013): ~0.9 lands
  # under the 0.3 `has_secondary_structure` floor (INTEGRITY, trust demoted) and ~0.6 lands
  # between the two bars (ACCEPTANCE shortfall, trust untouched).
  #
  # THERE IS DELIBERATELY NO TERM HERE FOR THE STEERING. `ss_fraction` does not rise with
  # `n_restarts` or with `reward_terminal`, because a twin whose backbone quality improved
  # with steering would make every laptop run *show* steering working -- which is the
  # hypothesis M2 exists to test, and this project's recurring failure class wearing a hat.
  # `operator_only`, AND LEAVING IT OFF WAS MEASURED RATHER THAN REASONED ABOUT. The first
  # version of this parameter omitted it, because `reward_spread` above has no such marking
  # either. Run: the chain's refinement path escalated `difficulty` to about 0.45 at cycle 1,
  # the node came back with `ss_fraction` 0.481 against the new 0.5 acceptance bar, and it was
  # dropped from the front -- a REFINED design that was worse than its parent, by a knob the
  # planner turned. `difficulty` is the experiment's independent variable, not a dial a
  # reasoner may choose; upstream marks its own copy the same way and says why: "a model asked
  # to satisfy the objectives, and told there is a 0.0-to-1.0 knob called 'how hard this
  # campaign is', turns it down". `reward_spread` needs no such marking -- it is a property of
  # the fake scorer, not of the target, and no objective moves with it.
  difficulty: {type: float, default: 0.25, min: 0.0, max: 1.0,
               trades: "mock only: how hard the target is, hence the backbone quality the head
                        of the chain hands downstream; the dial that reaches both gate roles",
               operator_only: "the experiment's own condition - a reasoner that could turn it
                               down would be choosing its own difficulty"}
metrics: [ess_mean, n_resamples, reward_terminal, particle_diversity,
          conditioning_requested, conditioning_applied, length_dropped,
          template_lists_overridden,
          # The real spec's six, added by EI.31. `num_models` is the surviving population
          # where the real tool counts sidecar-carrying models -- both are "how many designs
          # this invocation produced", which is what downstream reads it as.
          ss_fraction, num_models, ca_deviation, ligand_clashes,
          helix_fraction, sheet_fraction]
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported,
     params: {metrics: [ess_mean, n_resamples, reward_terminal, particle_diversity]}}
  - {id: metrics_reported, params: {metrics: [conditioning_requested, conditioning_applied]}}
  - {id: metric_in_range, role: integrity,
     params: {metric: conditioning_applied, min: 1}}
  - {id: metric_in_range, role: acceptance,
     params: {metric: n_resamples, min: 1}}
  # The real spec's three, at the real spec's numbers (EI.31). A twin with an easier floor
  # than its tool is a laptop run that cannot reach the failure the tool can.
  - {id: has_secondary_structure, params: {min_ss_fraction: 0.3}}
  - {id: metrics_reported, params: {metrics: [ss_fraction, num_models]}}
  - {id: metric_in_range, role: acceptance, params: {metric: ss_fraction, min: 0.5}}
# CPU-hours, because this twin declares no GPU. Thousandths of an hour: non-zero so the ledger
# counts something, small enough that gate 5 stays out of the way on a laptop.
cost_model: {unit: invocation, cost: {cpu_hours: 0.002}}
