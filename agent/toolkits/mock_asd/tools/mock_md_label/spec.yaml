# Twin of `md_label` (item 20, EI.12). Apo + holo MD -> Model B's three measured quantities.
#
# TWO NAMING RULES, for two different reasons, and both are tested:
#   * `mock_` on the ID, because ids are one flat namespace and `_load_toolkit` is all-or-nothing:
#     a twin sharing its real tool's id makes the OTHER toolkit register nothing (measured; see
#     toolkits/mock_asd/SKILL.md).
#   * `toolkit: mock` in the FIELD, because gate 6 is `(spec.toolkit == "mock") is want_real`, so a
#     twin declaring `mock_asd` would be ADMITTED by a campaign declaring tool_delivery: real.
#
# Ports and metric names are the real spec's, unchanged. The cost model and walltime are NOT: a
# surrogate that declared 8.1 GPU-h would make a laptop campaign refuse its own chain at gate 5.
id: mock_md_label
toolkit: mock
version: "0.1"
pattern: P1
entry: asteer.impress.mock_asd.MockMDLabelAgent
# 30s because the agent hashes its parameters and returns. `gpus: 1` stays: a P1 tool declaring no
# GPU is a load-time error, and the concurrent backend never looks for a device.
resources: {gpus: 1, cores: 8, walltime_s: 30}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
# A root, exactly as the real tool is -- so the twin exercises the same missing-root-input hazard.
outputs:
  trajectory: {type: Trajectory}
  # The second port, for the same reason as the real spec: without it gate 1 refuses the chain.
  structure: {type: Complex}
parameters:
  design_dir: {type: str, default: "", trades: "which design is being measured"}
  ligand_params_path: {type: str, default: "", trades: "the ligand's own .params"}
  apo_ns: {type: float, default: 15.0, min: 1.0, max: 100.0, trades: "apo sampling vs GPU-hours"}
  holo_ns: {type: float, default: 15.0, min: 1.0, max: 100.0, trades: "holo sampling vs GPU-hours"}
  md_replicates: {type: int, default: 1, min: 1, max: 8,
                  trades: "measurement precision vs GPU-hours; NOT the campaign's replicas"}
  seed: {type: int, default: null, min: 0, max: 2147483647, trades: "per-run draw"}
  # THE SURROGATE'S OWN DIAL, with no real counterpart: how well the run equilibrates. At the 0.0
  # default `rmsd_plateau_frac` lands near 0.85 and the integrity gate passes. Above ~0.6 it falls
  # under the 0.5 floor, which is an INTEGRITY failure -- the pattern's trust is demoted, which is
  # the label-side behaviour decision 0013 describes and the thing worth being able to watch.
  #
  # `operator_only` for the same reason rfd3's `difficulty` is: a reasoner shown a 0.0-to-1.0 knob
  # called "how badly this measurement converges" turns it down, and the hard arm becomes the easy
  # one with nothing saying so.
  instability: {type: float, default: 0.0, min: 0.0, max: 1.0,
                trades: "how poorly this run equilibrates; surrogate-only, no MD counterpart",
                operator_only: "the experiment's own condition - a reasoner that could turn it
                                down would be choosing whether its instrument works"}
metrics: [preorg_rmsd, rotamer_entropy, ligand_rmsf, rmsd_plateau_frac, energy_drift_kcal_per_ns]
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [preorg_rmsd, rotamer_entropy, ligand_rmsf]}}
  - {id: metric_in_range, role: integrity, params: {metric: rmsd_plateau_frac, min: 0.5}}
# Thousandths of an hour: non-zero so the ledger counts something, small enough that gate 5 and the
# untrusted-pattern cap stay out of the way on a laptop. NOT a measurement of anything.
cost_model: {unit: invocation, cost: {gpu_hours: 0.002}}
