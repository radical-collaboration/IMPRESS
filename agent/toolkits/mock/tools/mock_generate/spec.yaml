id: mock_generate
toolkit: mock
version: "0.1"
pattern: P1
entry: impress_a.tools.mock_agents.GenerateAgent
resources: {gpus: 1, cores: 4, walltime_s: 30}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: plausible}
outputs:
  designs: {type: Backbone}
parameters:
  num_designs: {type: int, default: 4, min: 1, max: 64, trades: "coverage vs GPU-hours"}
  diffusion_steps: {type: int, default: 50, min: 20, max: 200, trades: "quality vs time"}
frozen_parameters:
  checkpoint: "Mixing checkpoints within a campaign makes designs non-comparable."
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: has_secondary_structure, params: {min_ss_fraction: 0.3}}
cost_model: {unit: invocation, cost: {gpu_hours: 0.02}}
