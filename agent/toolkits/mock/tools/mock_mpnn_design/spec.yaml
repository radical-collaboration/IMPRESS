# Surrogate for `ligandmpnn_design`. See mock_rfd3_design/spec.yaml for why these live in the
# `mock` toolkit and what was changed from the real spec.
id: mock_mpnn_design
toolkit: mock
version: "0.1"
pattern: P1
entry: impress_a.tools.mock_smb_agents.MockMPNNDesignAgent
resources: {gpus: 1, cores: 4, walltime_s: 30}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  backbone: {type: Backbone}
outputs:
  structure: {type: Complex}
parameters:
  temperature: {type: float, default: 0.2, min: 0.0, max: 1.0, trades: "diversity vs recovery"}
  batch_size: {type: int, default: 8, min: 1, max: 64,
               trades: "candidates per pass; wider is near-free on a GPU until memory"}
  number_of_batches: {type: int, default: 1, min: 1, max: 16,
                      trades: "serial passes; linear in time, so prefer batch_size"}
  num_seqs: {type: int, default: 1, min: 1, max: 64}
  pack_side_chains: {type: bool, default: true}
  fixed_residues: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
# `ensemble_size` is `batch_size * number_of_batches`, as the real adapter reports it;
# `ensemble_paired` is 1.0 always, because a surrogate has no two file sets to mismatch.
metrics: [overall_confidence, ligand_confidence, ensemble_size, ensemble_paired]
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [overall_confidence, ligand_confidence]}}
  - {id: metric_in_range, role: acceptance, params: {metric: overall_confidence, min: 0.4}}
  - {id: metric_in_range, role: acceptance, params: {metric: ligand_confidence, min: 0.4}}
cost_model: {unit: invocation, cost: {gpu_hours: 0.002}}
