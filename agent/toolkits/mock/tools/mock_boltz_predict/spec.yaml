# Surrogate for `boltz_predict`. See mock_rfd3_design/spec.yaml for why these live in the
# `mock` toolkit and what was changed from the real spec.
id: mock_boltz_predict
toolkit: mock
version: "0.1"
pattern: P1
entry: impress_a.tools.mock_smb_agents.MockBoltzPredictAgent
resources: {gpus: 1, cores: 4, walltime_s: 30}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  structure: {type: Complex}
outputs:
  complex: {type: Complex}
parameters:
  diffusion_samples: {type: int, default: 8, min: 1, max: 25,
                      trades: "samples per call; the best is carried forward, not all of them"}
  use_msa_server: {type: bool, default: false}
  ligand_smiles: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
metrics: [complex_plddt, ligand_iptm, ensemble_size, ensemble_paired]
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [complex_plddt, ligand_iptm]}}
  # 0.75 is upstream's calibrated PROD `fold_min_plddt: 75.0` rescaled to this metric's 0-1
  # range, and it is the tightest bar in the chain - which is why `difficulty` is felt here
  # first. Copied, not softened: a surrogate with an easier bar than the real campaign would
  # teach the wrong thing about when a design passes.
  - {id: metric_in_range, role: acceptance,
     params: {metric: complex_plddt, min: 0.75, max: 1.0}}
  - {id: metric_in_range, role: acceptance,
     params: {metric: ligand_iptm, min: 0.4, max: 1.0}}
cost_model: {unit: invocation, cost: {gpu_hours: 0.002}}
