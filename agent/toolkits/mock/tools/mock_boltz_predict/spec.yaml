# Surrogate for `boltz_predict`. See mock_rfd3_design/spec.yaml for why these live in the
# `mock` toolkit and what was changed from the real spec.
id: mock_boltz_predict
toolkit: mock
version: "0.1"
pattern: P1
entry: impress_a.tools.mock_smb_agents.MockBoltzPredictAgent
resources: {gpus: 1, cores: 4, walltime_s: 30}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  structure: {type: Complex}
outputs:
  complex: {type: Complex}
parameters:
  diffusion_samples: {type: int, default: 8, min: 1, max: 25,
                      trades: "samples per call; the best is carried forward, not all of them"}
  use_msa_server: {type: bool, default: false}
  ligand_smiles: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
  # Mirrored from the real spec, defaults included: the mirror test compares parameter NAMES,
  # and `mock_smb_agents` honours this one - the twin emits affinity metrics only when it is
  # set, which is the behaviour a campaign rehearsing against the mock needs to see.
  predict_affinity: {type: bool, default: false,
                     trades: "Model C's cheap input, at the cost of a second model load and a
                              second sampling pass over the predicted complex"}
  sampling_steps_affinity: {type: int, default: 200, min: 10, max: 1000,
                            trades: "affinity denoising steps; upstream's default is 200"}
  diffusion_samples_affinity: {type: int, default: 5, min: 1, max: 25,
                               trades: "affinity samples, averaged by the two-head ensemble;
                                        upstream's default is 5"}
  affinity_mw_correction: {type: bool, default: false,
                           trades: "upstream's MW term; changes the quantity, not its quality"}
# The affinity three are declared and NOT gated, exactly as in the real spec: they exist only
# when `predict_affinity` is set, so a gate demanding them would fail every ordinary run.
metrics: [complex_plddt, ligand_iptm, ensemble_size, ensemble_paired,
          affinity_pred_value, affinity_probability_binary, affinity_on_reported_sample]
# Copied from the real spec in words as well as in names. The twin's VALUES are invented; what
# they MEAN is not, and a surrogate corpus whose columns say nothing about themselves is how an
# invented number gets read later as a free energy.
metric_units:
  affinity_pred_value: "log10(IC50 / 1 uM); lower is tighter; not kcal/mol and not a dG"
  affinity_probability_binary: "probability that the ligand is a binder, 0-1, dimensionless"
  affinity_on_reported_sample: "1 if the affinity was scored on the same co-fold whose
                                complex_plddt is reported here, 0 if Boltz's confidence_score
                                rank 0 and this adapter's complex_plddt pick disagreed"
  complex_plddt: "pLDDT on a 0-1 scale, NOT the 0-100 scale upstream's thresholds use"
  ligand_iptm: "interface pTM for the ligand chain, 0-1, dimensionless"
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [complex_plddt, ligand_iptm]}}
  # 0.75 is upstream's calibrated PROD `fold_min_plddt: 75.0` rescaled to this metric's 0-1
  # range, and it is the tightest bar in the chain - which is why `difficulty` is felt here
  # first. Copied, not softened: a surrogate with an easier bar than the real campaign would
  # teach the wrong thing about when a design passes.
  - {id: metric_in_range, role: acceptance,
     params: {metric: complex_plddt, min: 0.75, max: 1.0}}
  - {id: metric_in_range, role: acceptance,
     params: {metric: ligand_iptm, min: 0.4, max: 1.0}}
cost_model: {unit: invocation, cost: {gpu_hours: 0.002}}
