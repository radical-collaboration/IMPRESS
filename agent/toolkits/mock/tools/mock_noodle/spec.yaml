id: mock_noodle
toolkit: mock
version: "0.1"
pattern: P1
entry: impress_a.tools.mock_agents.NoodleAgent
resources: {gpus: 1, cores: 2, walltime_s: 10}
gpu_portability: {cuda: proven}
outputs:
  designs: {type: Backbone}
parameters:
  num_designs: {type: int, default: 2, min: 1, max: 8}
metrics: [ss_fraction, designability]
qc_gates:
  - {id: has_secondary_structure, params: {min_ss_fraction: 0.3}}
cost_model: {unit: invocation, cost: {gpu_hours: 0.001}}
