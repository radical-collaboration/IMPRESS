# Apo + holo MD, 30 ns total, producing the measured counterparts of Model B's predictions.
#
# Ports, parameters, metrics and gates are COPIED from the settled table in the impress-a plan,
# item 36 (EI.21), not derived here. If this file disagrees with that table, the table is right
# and the disagreement is a finding about EI.21 rather than a local fix.
id: md_label
toolkit: asteer_labels
version: "0.1"
pattern: P1
entry: impress_a.tools.asteer_labels_agents.MDLabelAgent
# ~2-3.6 GPU-h per design at 30 ns total (item 20). The walltime bound is the declared ceiling
# with the same 2.25x margin item 21 requires of the cost model, because a bound tighter than the
# declaration would kill a run the budget had already paid for.
resources: {gpus: 1, cores: 16, walltime_s: 32400}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
# NO `inputs:`. This tool is a ROOT: the complex arrives as a path PARAMETER, exactly as
# `rfd3_design` takes `input_spec_path`. That is deliberate and it is also this chain's silent
# failure -- `compose/validate.py:79`-`:81` is a literal `pass` for an unsatisfied root input, so
# nothing upstream checks that the path arrived. The agent refuses at parameterize time instead;
# see item 36's root-input section and the agent's own docstring.
outputs:
  trajectory: {type: Trajectory}
  # THE SECOND PORT IS NOT TIDINESS. Without it gate 1 refuses the chain: `unifies_with` admits
  # identity, COMPLEX->BACKBONE and METRIC_SET->METRIC and nothing else (`core/types.py:58`-`:67`),
  # so a Trajectory cannot satisfy abfe_label's `structure: {type: Complex}` requirement. This is
  # the equilibrated representative frame of the holo leg, which is also the structure ATM should
  # start from -- the type constraint and the science agree, which is why it is the right fix
  # rather than a workaround.
  structure: {type: Complex}
parameters:
  # The design this run measures. A path parameter rather than a port, per the root note above.
  # Both `operator_only`, for the reason the two below are: they are filesystem paths and not
  # design knobs. `design_dir` decides WHICH MOLECULE is measured, and a label supersedes a
  # prediction on a specific node -- a reasoner that could move it would file one design's
  # measurement against another's node, with nothing anywhere disagreeing. Neither was
  # proposable by any planner in practice (the labels campaign runs model B, whose
  # `RehearsalOracle` returns the declared chain with empty params); marking them says so.
  design_dir: {type: str, default: "", trades: "which design is being measured",
               operator_only: "which molecule is measured, set per launch by the dispatcher -
                               a reasoner moving it files one design's label against another"}
  ligand_params_path: {type: str, default: "",
                       trades: "the ligand's own .params; the resname inside it may be the
                                literal A:R rather than ALR -- never 'clean up' the colon",
                       operator_only: "a path to the design's own params file, not a knob"}
  # K1's artifact, and NOT the line above. `ligand_params_path` is a Rosetta .params -- atom
  # types and charges for Rosetta's scoring function, from which nothing transfers to an MD
  # force field. This is the directory holding ligand_parameters.json, ligand.mol2 and
  # ligand.frcmod. No default, and the agent refuses an empty one by name: that artifact is
  # what records the force field, and a force field is part of what a measured number means.
  #
  # `operator_only`, which `tools/view.py` enforces by reporting it under `frozen` so it never
  # appears on the card a reasoner proposes against. Two reasons, and the second is the one a
  # security review would name first: this path decides WHICH FORCE FIELD a measurement is in,
  # so a reasoner moving it would silently change what every number from this tool means; and
  # it is a filesystem path this tool reads an artifact out of, which is not a design knob in
  # any sense. The campaign sets it, as it sets `design_dir`.
  md_params_dir: {type: str, default: "",
                  trades: "which parameterisation of the ligand this measurement is OF;
                           campaigns/data/alr/md is the committed GAFF2/AM1-BCC one",
                  operator_only: "the measurement's own force field, and a path this tool reads
                                  - a reasoner that could move it would be choosing what its
                                  own numbers mean"}
  # Where AmberTools is, when it is not on PATH. tleap is the one dependency pip cannot
  # supply; empty means "look on PATH", and the agent refuses by name if neither answers.
  #
  # `operator_only`, and here it is squarely a security boundary rather than a provenance one:
  # the value is joined to `bin/tleap` and EXECUTED (`md/system.py::_run_tleap`). A proposable
  # parameter that selects an executable path is arbitrary command execution by a reasoner that
  # has been talked into it. The campaign and the environment are the only two places this may
  # come from, and both are the operator's.
  amberhome: {type: str, default: "",
              trades: "which AmberTools builds the system; empty means whatever is on PATH",
              operator_only: "joined to bin/tleap and executed - an executable path is never a
                              knob a reasoner may turn"}
  apo_ns: {type: float, default: 15.0, min: 1.0, max: 100.0,
           trades: "apo sampling vs GPU-hours; the apo leg is what preorganisation is measured against"}
  holo_ns: {type: float, default: 15.0, min: 1.0, max: 100.0,
            trades: "holo sampling vs GPU-hours"}
  # `md_replicates`, NOT `replicas`. The campaign's `replicas` is a cap on independent design
  # lineages (`runtime/executor.py:861`); this is the number of MD seeds for one measurement. Two
  # fields one letter apart with different owners is how a label batch silently becomes four.
  md_replicates: {type: int, default: 1, min: 1, max: 8,
                  trades: "measurement precision vs GPU-hours; NOT the campaign's replicas"}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-run draw; two replicates are only independent if this is honoured"}
  # K5. Default TRUE, unlike boltz_predict's `predict_affinity`, and the asymmetry is the cost:
  # the affinity head is a second sampling pass on a GPU, this is single-point energies over
  # frames that already exist. It buys a candidate prior for Model C for no GPU time at all.
  mmgbsa: {type: bool, default: true,
           trades: "an endpoint free-energy sample per frame vs a few CPU-minutes per design"}
  mmgbsa_stride: {type: int, default: 1, min: 1, max: 100,
                  trades: "frames evaluated vs CPU time; the frames are already written, so
                           this only trades the energy evaluations"}
metrics:
  # The three measured quantities, named to match what they supersede (item 36's naming table).
  - preorg_rmsd
  - rotamer_entropy
  - ligand_rmsf
  # Convergence telemetry, which the integrity gate below reads. Reported separately from the
  # measurements on purpose: these say whether the instrument worked, not what it found.
  - rmsd_plateau_frac
  - energy_drift_kcal_per_ns
  # K5's second product, out of the same frames and for no extra GPU time. Declared here and
  # DELIBERATELY NOT in metrics_reported below: the three labels are what this tool exists to
  # measure, and a dry-build failure that costs the free-energy sample has not stopped the
  # instrument from working. Demanding it unconditionally would file a successful 30 ns
  # measurement as an integrity failure, which is the hazard decision 0013 is about.
  - dg_mmgbsa
# Item 36's naming contract and J13's rule that the unit is a field rather than a sentence in a
# commit message: a corpus outlives the checkout that produced it.
metric_units:
  preorg_rmsd: "angstrom; pocket Ca RMSD of the apo ensemble against the holo one"
  rotamer_entropy: "nat; Shannon entropy over rotamer-bin occupancy, ceiling ln 3 per dihedral"
  ligand_rmsf: "angstrom; per-atom fluctuation after aligning on the pocket"
  rmsd_plateau_frac: "fraction of the run after the RMSD stopped rising, 0-1"
  energy_drift_kcal_per_ns: "kcal/mol/ns; least-squares slope of the total energy"
  dg_mmgbsa: "kcal/mol; MM/GBSA endpoint interaction enthalpy plus solvation, OBC2 on frames
              sampled in explicit TIP3P, NO entropy term. NOT a dG_bind and NOT dg_abfe --
              dg_abfe is ATM's measured value and the property name is what supersession
              matches on"

qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [preorg_rmsd, rotamer_entropy, ligand_rmsf]}}
  # INTEGRITY, not acceptance, and the distinction is decision 0013: only integrity failures demote
  # a pattern in the trust ledger. An MD run that did not equilibrate is a BROKEN INSTRUMENT, not a
  # weak design -- filing it as acceptance would count a tool failure against the molecule.
  - {id: metric_in_range, role: integrity,
     params: {metric: rmsd_plateau_frac, min: 0.5}}
# 2.25x the worst observed (item 21). 3.6 GPU-h worst observed x 2.25 = 8.1, which is the figure
# item 36's budget arithmetic uses: md_label alone needs 81 GPU-h available to clear the
# interlock's 10% cap, which fits a 96-192 per-round envelope -- so this tool promotes the ordinary
# three-clean-runs way and does not need item 21's trust assertion. That is most of why decision L1
# split the chain.
#
# K6 (2026-11-24): THE 8.1 STILL IS NOT A MEASUREMENT, and it is left alone rather than
# refreshed. The 3.6 it derives from was declared, never measured; the protocol now exists and
# has run on a CPU, and a CPU figure extrapolated to an A100 would be the same defect with a
# newer date on it. What the protocol now emits is the thing that replaces it: every run reports
# `ns_per_day` and `gpu_hours_observed` beside its platform (md.protocol.Measured), so the first
# real GPU run prints the figure and item 21's 2.25x margin turns it into this line.
#
# TWO THINGS K6 DID SETTLE.
#
# `max_commitment` is DERIVED from this spec's own resources rather than guessed: 1 GPU x
# 32400 s = 9.0 GPU-h is the hard ceiling of one invocation, because the scheduler kills it
# there. That makes the declared 8.1 exactly 90% of what an invocation can physically spend --
# so a cost model above 9.0 would be declaring a cost no run can incur, and the cap now says so.
#
# AND THE SHAPE IS WRONG, which is a finding about `CostModel` and not about this number.
# `cost` is per invocation and this tool's real cost is linear in `md_replicates` (1 to 8) and in
# `apo_ns + holo_ns` (2 to 200), all three of them parameters the reasoner may set. A single
# per-invocation figure can therefore only ever be a worst case, and 8.1 is not even that: at 8
# replicates and 100 ns legs it is low by a factor of about 50, and only the walltime ceiling
# stops the run. Recorded as backlog row 81; the honest reading until it is addressed is that
# `max_commitment` is the number that bounds a campaign and `cost` is what it plans with.
cost_model:
  unit: invocation
  cost: {gpu_hours: 8.1}
  max_commitment: {gpu_hours: 9.0}
