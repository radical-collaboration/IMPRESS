id: boltz_predict
toolkit: boltz
version: "0.1"
pattern: P1
entry: impress_a.tools.boltz_agents.BoltzPredictAgent
resources: {gpus: 1, cores: 4, walltime_s: 600}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  structure: {type: Complex}
outputs:
  complex: {type: Complex}
parameters:
  # Default 1: see rfd3_design.num_designs - breadth is `replicas`, not internal N.
  diffusion_samples: {type: int, default: 1, min: 1, max: 25, trades: "sampling vs GPU-hours"}
  # Default FALSE: `true` emits `msa: auto` and passes --use_msa_server, which calls out
  # to the MSA server - and Delta compute nodes have no egress, so the task stalls until
  # its walltime kill rather than failing. The original IMPRESS pipeline hardcodes
  # `msa: empty` for this reason and never offers the flag. Set true only where the
  # allocation is known to have outbound network.
  use_msa_server: {type: bool, default: false}
  ligand_smiles: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
metrics: [complex_plddt, ligand_iptm]
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metric_in_range, params: {metric: complex_plddt, min: 0.5, max: 1.0}}
  - {id: metric_in_range, params: {metric: ligand_iptm, min: 0.4, max: 1.0}}
# Measured on job 22692304 - the first run in which this tool executed at all: 57.8s
# = 0.0160 h. Declared 0.15 was 9.3x that, the same literature guess the other five
# carried, and it was left alone in 77a0363 precisely because there was nothing to
# correct it against.
#
# 0.05 is ~3x measured, NOT the measured figure. One run is one sample: rfd3_design
# took 145.7s in job 22684607 and 45.0s in 22692304 - same campaign, same allocation
# shape, same parameters, 3.2x apart. These numbers feed gate 5 and the untrusted-
# pattern cap, which REFUSE graphs, so a cost model tuned to a fast observation starts
# rejecting work the first time a slow one arrives.
cost_model: {unit: invocation, cost: {gpu_hours: 0.05}}
