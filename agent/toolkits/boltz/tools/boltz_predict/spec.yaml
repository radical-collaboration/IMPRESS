id: boltz_predict
toolkit: boltz
version: "0.1"
pattern: P1
entry: impress_a.tools.boltz_agents.BoltzPredictAgent
resources: {gpus: 1, cores: 4, walltime_s: 600}
gpu_portability: {cuda: proven, hip: unproven, sycl_xpu: unproven}
inputs:
  structure: {type: Complex}
outputs:
  complex: {type: Complex}
parameters:
  # Internal sampling. Raising it only pays because the adapter now selects the best sample by
  # `complex_plddt` rather than keeping `[0]`; before that N were computed, N were charged for,
  # and one was reported by sort order.
  diffusion_samples: {type: int, default: 8, min: 1, max: 25,
                      trades: "samples per call; the best is carried forward, not all of them"}
  # Default FALSE: `true` emits `msa: auto` and passes --use_msa_server, which calls out
  # to the MSA server - and Delta compute nodes have no egress, so the task stalls until
  # its walltime kill rather than failing. The original IMPRESS pipeline hardcodes
  # `msa: empty` for this reason and never offers the flag. Set true only where the
  # allocation is known to have outbound network.
  use_msa_server: {type: bool, default: false}
  ligand_smiles: {type: str, default: ""}
  seed: {type: int, default: null, min: 0, max: 2147483647,
         trades: "per-lineage draw; replicas are only independent if this is honoured"}
# `ensemble_size`/`ensemble_paired`: see the note in ligandmpnn_design's spec. Boltz writes
# `confidence_<name>_model_<n>.json` beside `<name>_model_<n>.pdb`, so the pairing is by member
# number rather than by position - two independently sorted globs agree only by luck.
metrics: [complex_plddt, ligand_iptm, ensemble_size, ensemble_paired]
# Integrity gates say the tool worked; acceptance gates say the design is good enough.
# Only integrity failures reset trust (docs/decisions/0013). Each acceptance threshold is
# backed by `metrics_reported`, so a value the adapter could not read is an integrity
# failure, never a low score.
qc_gates:
  - {id: output_present, params: {key: result}}
  - {id: metrics_reported, params: {metrics: [complex_plddt, ligand_iptm]}}
  # 0.75, raised from 0.5 to match upstream's calibrated `PROD` (backlog G4). The rescale is
  # the thing to notice: `PROD`'s `fold_min_plddt: 75.0` applies to a 0-100 figure and this
  # metric is `complex_plddt * 100.0`, so 75.0 there is 0.75 here. Every recorded run of this
  # project sits below it - 0.426 / 0.486 / 0.507, including job 22692304's best - which is
  # why phase 8 built the refinement loop: at 0.5 the gate was passing designs the reference
  # would have rejected, and the campaign's own objectives were slacker than its target.
  - {id: metric_in_range, role: acceptance,
     params: {metric: complex_plddt, min: 0.75, max: 1.0}}
  # Kept, and STRICTER THAN PROD on this one axis: upstream leaves `ligand_iptm` ungated
  # deliberately. Every T3 figure has to say so, because a design this project calls passing
  # would clear one more bar than a design the reference calls passing.
  - {id: metric_in_range, role: acceptance,
     params: {metric: ligand_iptm, min: 0.4, max: 1.0}}
# Measured on job 22692304 - the first run in which this tool executed at all: 57.8s
# = 0.0160 h. Declared 0.15 was 9.3x that, the same literature guess the other five
# carried, and it was left alone in 77a0363 precisely because there was nothing to
# correct it against.
#
# 0.05 is ~3x measured, NOT the measured figure. One run is one sample: rfd3_design
# took 145.7s in job 22684607 and 45.0s in 22692304 - same campaign, same allocation
# shape, same parameters, 3.2x apart. These numbers feed gate 5 and the untrusted-
# pattern cap, which REFUSE graphs, so a cost model tuned to a fast observation starts
# rejecting work the first time a slow one arrives.
cost_model: {unit: invocation, cost: {gpu_hours: 0.05}}
