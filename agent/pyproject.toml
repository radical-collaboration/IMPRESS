[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impress-a"
version = "0.1.0"
description = "Autonomous protein design agent for HPC"
requires-python = ">=3.11"
dependencies = [
  # 0.7.0 is the floor for what the execution loop relies on: a cancel reaches the backend a
  # task was routed to (asyncflow #118), a block cancel cascades to its members, `future.uid`
  # exists at call time, and every task event names its real backend. Both require >=3.11,
  # which is why this project's floor is 3.11. The root project still declares >=0.4.0 on
  # >=3.9; that is the dependency firewall, not a conflict - its 3.9 leg resolves an older
  # asyncflow and never installs this package.
  "radical.asyncflow>=0.7.0",
  "rhapsody-py>=0.7.0",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2",
  "pyyaml",
  "paretoset>=1.2.5",
  "numpy",
  # PDB parsing in the real toolkit adapters (tools/_pdbtools.py, boltz_agents.py). Imported
  # lazily, but in the agent process itself - not inside a tool's subprocess or container.
  "biopython",
]

[project.optional-dependencies]
# flowgentic is 0.1.0 with no PyPI release; pin to a commit, never a branch.
agentbridge = ["flowgentic @ git+https://github.com/stride-research/flowgentic.git@dd27bd8b7e6edb2995038c9c1cc9b2fec3b7c7e9"]
# `openai`, not `litellm`. The extra named litellm and nothing imported it; what model B's
# live client needs is one OpenAI-compatible /chat/completions call, which is the official
# client's own surface and the shape every profile in models.yaml speaks. litellm would be a
# second abstraction over an interface that is already the compatibility layer.
oracle = ["openai>=1.40"]
http = ["httpx"]          # the HTTP control-plane adapter
# AuCaM (`radical-project/campaign_manager`), the enclosing campaign manager IMPRESS-A is
# offered to as a subordinate workflow (`integrations/aucam.py`, decision 0014). An EXTRA and
# not a dependency: a campaign host running a chain has no reason to carry an outer
# orchestrator, and nothing in the package imports it unless a caller asks for the adapter.
# Installed by scripts/dev_setup.sh anyway, for the reason the oracle extra gives - the
# adapter's tests build a real `WorkflowConfig` and emit through AuCaM's own reporter when it
# is present, and skip when it is not, which is only a useful guard if the dev venv has it.
#
# Pinned to a COMMIT, not to branch `aucam-v2` that currently points at it, for the reason
# the agentbridge extra states: `aucam` has no PyPI release, and a branch pin reinstalls
# something different next week. Its import path is `src.aucam`, not `aucam`: the
# distribution is named `aucam` but its `[tool.setuptools.packages.find]` declares
# `include = ["src*"]`, so the importable package is the generic name `src` - which
# setuptools itself warns about on install, and which `tests/test_toolchain.py` pins,
# because this repository has two `src/` directories of its own for it to be confused with.
aucam = ["aucam @ git+https://github.com/radical-project/campaign_manager/@2c9c734e064b28dc8c31cfe4a990247dac22c6bf"]
# Figures for the mock knob lab (`impress-a mock-lab`). An EXTRA, not a dependency: the lab's
# sweep and collect stages write CSVs with the standard library and numpy, which this project
# already has, and only `analysis/mock_figures.py` imports matplotlib. A campaign host has no
# reason to carry a plotting stack, and a laptop running the activity installs it in one line.
figures = ["matplotlib>=3.8"]
# Dragon, through rhapsody's own extra and never by naming `dragonhpc` here: rhapsody pins the
# Dragon release its backend is tested against (0.15.0 for rhapsody 0.7.0) and adds the
# `requests` dependency that release forgets. An EXTRA, because the laptop tier, CI and the
# knob-lab notebook all run on the concurrent backend and must not need Dragon to install.
dragon = ["rhapsody-py[dragon]>=0.7.0"]
# `cloudpickle` is a TEST dependency, not a runtime one: tests/test_real_toolkits.py uses it
# to prove `SubprocessError` survives being pickled across a process boundary. It was in no
# extra, so the `pytest.importorskip("cloudpickle")` guarding that assertion skipped it in
# CI while passing on any developer machine that happened to have it - a skip is not a pass.
# `ruff` is pinned to one minor: unpinned, a release adds rules overnight and turns the lint
# gate red on untouched code, and the ceiling here is zero. Same pin in the root project's
# `lint` extra and in tox.ini's lint env, which is what CI runs; move all three together.
dev = ["pytest", "pytest-asyncio", "ruff>=0.17,<0.18", "httpx", "cloudpickle"]

[project.scripts]
impress-a = "impress_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff resolves the NEAREST pyproject.toml with a [tool.ruff] table, walking upwards. Without
# this table it walked up to IMPRESS's own, which sets `fix = true` - so the documented
# `ruff check src tests` REWROTE the working tree rather than reporting on it (36 files on its
# first run), and the ceiling of 41 that CLAUDE.md quoted did not reproduce against it: 449
# findings under the resolved config, 9 under ruff's own defaults. Nothing linted `agent/` at
# all, and CI ran only the test suite. Hence a local table, and `ruff check src tests` in CI.
[tool.ruff]
line-length = 100
target-version = "py311"
# NEVER true here. A linter that edits the tree cannot be a gate: a clean run and a run that
# silently rewrote 36 files are indistinguishable afterwards. `ruff check --fix` on request.
fix = false
exclude = ["campaigns/_runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = [
  # UP007/UP045 (`X | None` over `Optional[X]`) are the root project's exclusions, kept so the
  # two trees read the same way.
  "UP007", "UP045",
  # N818 wants an `Error` suffix on `CampaignAborted`, `CampaignStopped`,
  # `SubmissionRejected` and `BackendConstructionTimeout`. Those four names are the written
  # vocabulary of this project: they appear in docs/impress-a/decisions, plans/done, docs/impress-a/limitations.md
  # and CLAUDE.md, and in sentences like "raises `CampaignStopped` if the campaign ends first"
  # that are the record of why a seam exists. Renaming them buys nothing at runtime and makes
  # every one of those sentences wrong, so the rule is declined rather than worked around with
  # four `noqa`s. Any NEW exception type should carry the suffix.
  "N818",
  # UP042 (`class X(str, Enum)` -> `StrEnum`) arrived with the py311 target. Declined, not
  # deferred: the two are NOT equivalent - `str(QCVerdict.PASS)` is "QCVerdict.PASS" for a
  # (str, Enum) and "pass" for a StrEnum, and f-strings follow `format`, which differs too on
  # 3.11 vs 3.12. These enums reach provenance, the ledgers and HTTP payloads, so the
  # change is a data-format change, and it belongs in a commit that says so, not in a lint fix.
  "UP042",
]
