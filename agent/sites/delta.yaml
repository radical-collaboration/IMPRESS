# Delta HPC (NCSA) site profile. Documentation/reference only, same role as local.yaml -
# nothing in src/impress_a reads sites/*.yaml today (confirmed: no code references this
# directory). The campaign YAML's own `backend`/`backend_config`/`site` keys are what
# actually take effect; this file exists for parity with local.yaml and as the source you
# copy those fields from when writing a Delta campaign.
name: delta
scheduler: slurm
backend: {kind: dragon, config: {}}
gpu: {vendor: nvidia, api: cuda, per_node: 4}
filesystems: {shared: "$WORK_DIR/impress_a_runs", scratch: "$WORK_DIR"}
# MOVED TO THE CAMPAIGN SPEC, where something reads it. This key was inert from the
# day it was written (backlog E1) - and it is the switch that would have refused the
# documented mock-chain-on-a-GPU run. It is now `tool_delivery: real` on a campaign
# spec, enforced by validation gate 6; kept here as the value to copy, not as a
# setting. A key in a file nobody reads is worse than no key: it reads as a control.
tool_delivery: {copy_to_campaign_spec: real}
p5_governor: {max_concurrency: {}}
