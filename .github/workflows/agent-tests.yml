name: agent-tests

# IMPRESS-A (agent/) is a separate package with its own Python floor, so it gets its own
# job rather than a leg in tests.yml. It runs only when agent/ changes.
# `src/impress/**` and the root `pyproject.toml` are in the path filter because IMPRESS-A now
# DEPENDS on the root package. Without them a change to the framework could break this package
# without ever running the job that would have caught it.
on:
  push:
    branches: [main]
    paths: ['agent/**', 'src/impress/**', 'pyproject.toml',
            '.github/workflows/agent-tests.yml']
  pull_request:
    paths: ['agent/**', 'src/impress/**', 'pyproject.toml',
            '.github/workflows/agent-tests.yml']
  workflow_dispatch:

jobs:
  unit:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      # Two steps, in this order, on purpose. IMPRESS-A now depends on `impress`, the package
      # at the repository root, which is unreleased - so it has to be present as a local
      # editable install BEFORE pip resolves this project's dependencies, or pip goes looking
      # for the name on PyPI and installs whatever it finds there.
      - name: Install impress (repository root)
        run: python -m pip install --upgrade pip && pip install -e ..
      # `aucam` in the same install as `dev`, so pip resolves once: `tests/test_aucam.py`
      # skips itself when the extra is absent, so without it the tests that prove an IMPRESS-A
      # campaign really runs as one AuCaM workflow never ran anywhere automated - green either
      # way, which is the failure this project already names as worse than a missing adapter.
      # It is a git pin to a public commit with no compiled dependencies: ~6s to resolve.
      - name: Install impress-a
        run: pip install -e ".[dev,aucam]"
      # A skip is not a pass, and the extra going missing again would be silent otherwise:
      # pytest exits 0 with the whole file skipped. This step fails loudly instead. The import
      # is `src.aucam`, not `aucam` - upstream's `include = ["src*"]` publishes the generic
      # name, and this repository has two `src/` directories of its own to be confused with.
      - name: Confirm the AuCaM adapter has something to test against
        run: python -c "import src.aucam, impress_a.integrations.aucam"
      # Nothing linted agent/ before this: there was no [tool.ruff] table here, so ruff walked
      # up to the root project's config, which sets `fix = true` - the documented command
      # rewrote the tree instead of reporting on it. The local table sets `fix = false`, and
      # the ceiling is now zero, so any finding here is a regression rather than a budget.
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: pytest tests -q
