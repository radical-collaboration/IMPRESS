name: agent-tests

# IMPRESS-A (agent/) is a separate package with its own Python floor, so it gets its own
# job rather than a leg in tests.yml. It runs only when agent/ changes.
on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  workflow_dispatch:

jobs:
  unit:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests -q
