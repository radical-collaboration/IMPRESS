name: ci

# One workflow for the whole repository, replacing tests.yml, agent-tests.yml and a
# docs.yml that was itself named `ci` - so `gh run list` showed three workflows per push,
# one of them under a name that described none of what it did. What the split cost:
#
#   * agent/ carried its own `ruff check` step and ran it three times, once per matrix leg,
#     while never checking formatting. `tox -e lint` resolved from the root to src/impress
#     and ./tests, so the repository's own lint entry point never saw the second package.
#   * docs.yml had no pull_request trigger and mkdocs had no strict mode, so a broken link
#     or a missing nav target was only discovered after it had already deployed.
#   * Two caching idioms and two install idioms for the same job in two files: root
#     hand-rolled actions/cache over `pip cache dir`, agent used setup-python's native
#     `cache: pip`, and the root lint job had no cache at all.
#
# No `paths:` filters, deliberately. Only the root suite was unfiltered before, so what
# this adds is the agent suite running on changes that touch neither agent/ nor
# src/impress - and in exchange no job can be absent for a regression that crosses the
# boundary. If CI minutes ever need trimming, filter the two test jobs and never `lint` or
# `docs`: those are the cheap ones, and the ones that caught nothing while they were absent.

# A weekly run alongside the usual triggers, for upstream drift. Nothing in either project
# pins radical.asyncflow, rhapsody-py or langgraph to an exact version, so a release of any
# of them can break a green tree that nobody has touched - and the committed notebook
# outputs would go on showing the old behaviour working. A scheduled run is the only thing
# that catches that before a reader does.
#
# It runs every job rather than only `notebooks`, because the same drift reaches the test
# suites. Narrow it with `if: github.event_name != 'schedule'` on the two matrix jobs if the
# minutes ever matter; `notebooks`, `lint` and `docs` are the cheap ones and should stay.
on:
  push:
    branches: [main, test-me-*]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only by default. The one job that needs to write says so for itself.
permissions:
  contents: read

jobs:
  # IMPRESS itself. One job for what used to be two near-identical 25-line copies that
  # differed only in a cache-key prefix and a step name. `toxenv` is spelled out in the
  # matrix rather than derived from `python`, because deriving it needs a ladder of nested
  # ternaries in YAML and this is a table either way. The `-all` legs are the radical.pilot
  # integration tier; tox.ini gives them RADICAL_VERBOSE=DEBUG and a `radical-stack` pre-step.
  root-tests:
    name: root ${{ matrix.toxenv }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.9',  toxenv: py39}
          - {python: '3.10', toxenv: py310}
          - {python: '3.11', toxenv: py311}
          - {python: '3.12', toxenv: py312}
          - {python: '3.13', toxenv: py313}
          - {python: '3.9',  toxenv: py39-all}
          - {python: '3.10', toxenv: py310-all}
          - {python: '3.11', toxenv: py311-all}
          - {python: '3.12', toxenv: py312-all}
          - {python: '3.13', toxenv: py313-all}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip tox
      - run: tox -e ${{ matrix.toxenv }} -- -vv

  # IMPRESS-A (agent/). A separate job and a separate environment, because impress-a
  # declares >=3.11 and pulls langgraph, rhapsody and biopython: those must never end up in
  # front of a root test, and no agent install belongs on the 3.9 leg above.
  #
  # Not driven by tox, on evidence. The earlier consolidation attempt added an `agent-py3xx`
  # tox env whose `deps` were `./agent[dev]` alone; in its one CI run every campaign test
  # failed and one wedged for twenty minutes, because impress-a then depended on the
  # unreleased `impress` and pip went to PyPI for that name. That dependency is gone (the
  # agent's Stages are asyncflow blocks), so a tox env would now resolve; moving this job is
  # a separate change, not a side effect of this one.
  agent-tests:
    name: agent py${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is here and was not in the workflow this replaces: agent/ was tested on
        # 3.10-3.12 while root was tested on 3.9-3.13, so the newest interpreter IMPRESS
        # supports was one nothing had ever run impress_a on. Verified before adding, not
        # after: both installs resolve on 3.13.9 and the suite is 506 passed, 5 skipped.
        # No 3.10: radical.asyncflow and rhapsody 0.7.0 require >=3.11.
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # Both files, kept: the notebooks job installs both packages and shares this
          # cache key shape.
          cache-dependency-path: |
            pyproject.toml
            agent/pyproject.toml
      # One install: IMPRESS-A no longer depends on `impress` (its Stages are asyncflow
      # blocks), so there is no unreleased root package to put in front of the resolver.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # Every extra whose absence a test answers with a skip, in one install so pip resolves
      # once. A skip is not a pass, and each of these was skipping in the only automated
      # environment there is:
      #   aucam    the tests that prove an IMPRESS-A campaign really runs as one AuCaM
      #            workflow. A git pin to a public commit, no compiled dependencies, ~6s.
      #   oracle   test_oracle.py builds a REAL openai client when it is present, which is
      #            the only thing that catches LangChainOracle claiming structured output
      #            over a brace-slice. No endpoint or key is contacted.
      #   figures  four mock-lab tests behind `importorskip("matplotlib")`.
      #   telemetry  test_telemetry.py turns the engine's telemetry on and reads what it
      #            wrote; behind `importorskip("opentelemetry.sdk")`.
      # Measured: 511 passed and 0 skipped with all four, against 506 passed and 5 skipped
      # with dev+aucam alone.
      - name: Install impress-a
        run: pip install -e ".[dev,aucam,oracle,figures,telemetry]"
      # A skip is not a pass, and the extra going missing again would be silent otherwise:
      # pytest exits 0 with the whole file skipped. This step fails loudly instead. The import
      # is `src.aucam`, not `aucam` - upstream's `include = ["src*"]` publishes the generic
      # name, and this repository has two `src/` directories of its own to be confused with.
      - name: Confirm the AuCaM adapter has something to test against
        run: python -c "import src.aucam, impress_a.integrations.aucam"
      # No lint step here any more: `tox -e lint` covers agent/src and agent/tests from the
      # repository root, in one job, once - rather than three times across this matrix.
      # `-rs` lists any skipped test with its reason. The suite skips nothing in this
      # environment today, and if that changes the log says which test and why rather than
      # hiding it behind -q.
      - name: Run tests
        run: pytest tests -q -rs

  # The two Colab notebooks under docs/notebooks/, re-executed headlessly.
  #
  # They are committed with their outputs, because the documentation site renders them for
  # readers who never open Colab. That is also what makes them the one part of the
  # documentation that can rot into a lie with nobody touching it: an upstream release
  # breaks the code while the committed output still shows it working. This job is the only
  # thing that would notice.
  #
  # One job, both packages, because the notebooks cover one each - `tox -e notebooks` does
  # the same two-step editable install, in the same order and for the same reason, as
  # agent-tests above.
  #
  # 3.12 is what Google Colab ships, and the notebooks' promise is that they run there.
  # It is deliberately a single version rather than a matrix: this checks a documented
  # environment, not the support range, which root-tests and agent-tests already cover.
  notebooks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            agent/pyproject.toml
      - run: python -m pip install --upgrade pip tox
      - run: tox -e notebooks

  # Both projects, one entry point. ruff resolves its configuration per file, so this holds
  # root's contract and agent/'s at the same time without either adopting the other's width.
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            agent/pyproject.toml
      - run: python -m pip install --upgrade pip tox
      - run: tox -e lint
      # `fix = false` in both [tool.ruff] tables is what makes the step above a check rather
      # than a rewrite. If someone restores `fix = true`, lint starts passing by editing the
      # checkout instead of reporting on it - so assert the tree is clean afterwards.
      - name: Lint must not modify the tree
        run: git diff --exit-code

  docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip tox
      # Always, on pull requests too. `tox -e docs` builds the site and then fails on a
      # broken internal link or a missing nav target - the half of `--strict` this repository
      # can hold today. The workflow this replaces deployed those green.
      - run: tox -e docs

  # Separate from `docs` so that pull-request builds never request write access, and so a
  # deploy cannot happen unless the checked build passed first.
  docs-deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install .[doc]
      - name: Configure Git credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: mkdocs gh-deploy --force
