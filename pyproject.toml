[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impress"
version = "0.1.0"
description = "IMPRESS Protein Binding and Prediction Framework for HPC"

authors = [
    {name = "Aymen Alsaadi", email = "aymen.alsaadi@rutgers.edu"},
    {name = "RADICAL Lab"},
]
maintainers = [
    {name = "Aymen Alsaadi", email = "aymen.alsaadi@rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "radical.pilot",
    "radical-asyncflow>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/radical-collaboration/IMPRESS/tree/main"
Issues = "https://github.com/radical-collaboration/IMPRESS/issues"

[project.optional-dependencies]

lint = ["ruff"]

# examples/agentic_small_molecule_binding: an LLM reasoner reached through an
# OpenAI-compatible endpoint. Not needed by any other example.
agentic = [
    "openai>=1.40",
    "pyyaml"
]

# All test deps
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

doc = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.9",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-section-index==0.3.8",
    "mkdocs-glightbox",
    "mkdocs-material-extensions",
    "mkdocs-minify-plugin"
]

[tool.ruff]
# One lint contract for both projects in this repository: `impress` under src/, and
# `impress_a` under agent/. agent/pyproject.toml deliberately declares no [tool.ruff] of
# its own - ruff walks up to this table, which is the point.
#
# 100, not 88, and the number is measured rather than chosen. agent/ was written to a
# ~92-column convention and has 404 lines over 88, but only 10 over 100; src/ and tests/
# have none over either. `ruff format` is no help there, because it reflows code and never
# comments or docstring prose - it clears barely a quarter of those E501s while rewriting
# 57 of agent/'s 65 files. So the width moves and the code mostly does not.
line-length = 100
# py39 is right for `impress`, whose floor is 3.9, and conservative for `impress_a`, whose
# floor is 3.10: the UP rules simply modernize less there than they could. One table is
# worth more than the few extra fixes a split would buy.
target-version = "py39"
# NOT true. With `fix = true` the documented `ruff check` command rewrites the working
# tree instead of reporting on it: running it once here applied 36 fixes across 20 files
# nobody had touched, and `tox -e lint` was silently fixing before it checked, so the lint
# env could never fail on anything autofixable. Use `tox -e format` to fix.
fix = false

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["UP007", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"

testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["radical.asyncflow"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.codespell]
skip = """
.git,
.github,
__pycache__,
build,
dist,
.*egg-info
"""