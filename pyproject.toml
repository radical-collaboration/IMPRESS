[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impress"
version = "0.1.0"
description = "IMPRESS Protein Binding and Prediction Framework for HPC"

authors = [
    {name = "Aymen Alsaadi", email = "aymen.alsaadi@rutgers.edu"},
    {name = "RADICAL Lab"},
]
maintainers = [
    {name = "Aymen Alsaadi", email = "aymen.alsaadi@rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "radical.pilot",
    "radical-asyncflow>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/radical-collaboration/IMPRESS/tree/main"
Issues = "https://github.com/radical-collaboration/IMPRESS/issues"

[project.optional-dependencies]

# Pinned to one minor. Unpinned, a ruff release adds rules overnight and turns `tox -e lint`
# red on code nobody touched - and the ceiling for both projects is zero, so there is no
# budget to absorb that. The same pin is in agent/pyproject.toml's `dev` extra and in
# tox.ini's lint env, which is what CI runs; move all three together.
lint = ["ruff>=0.17,<0.18"]

# examples/agentic_small_molecule_binding: an LLM reasoner reached through an
# OpenAI-compatible endpoint. Not needed by any other example.
agentic = [
    "openai>=1.40",
    "pyyaml"
]

# All test deps
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov"
]

doc = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.9",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-section-index==0.3.8",
    "mkdocs-glightbox",
    "mkdocs-material-extensions",
    "mkdocs-minify-plugin"
]

[tool.ruff]
# This table governs `impress` only. `agent/pyproject.toml` declares its own, at
# line-length 100 and target-version py310, and `agent/tests/test_toolchain.py` asserts it
# is there - ruff resolves configuration per file, so one `tox -e lint` covers both
# projects without either having to adopt the other's width. Do not merge the two tables.
line-length = 88
target-version = "py39"
# NOT true. With `fix = true` the documented `ruff check src tests` rewrote the working tree
# instead of reporting on it, and `tox -e lint` was fixing before it checked - so that env
# could never fail on anything autofixable, which is most of what `select` below picks.
# `tox -e format` is the one that fixes. `agent/pyproject.toml` says the same of its own
# table, and ci.yml asserts both with `git diff --exit-code` after lint.
fix = false

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["UP007", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"

testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
# `impress`, not `radical.asyncflow` - this measured the coverage of a DEPENDENCY, while
# `tox -e coverage` passes `--cov=impress` on the command line and silently disagreed with it.
source = ["impress"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.codespell]
# Run by tox -e lint. Each of these three is a word this repository means, not a typo, and
# each was a finding before it was listed:
#   ser          serine, in the amino-acid three-letter -> one-letter map
#                (agent/src/impress_a/tools/boltz_agents.py). Will recur in a protein codebase.
#   fro          inside a quoted description of overlapping figure labels - "no fronto fro" is
#                literally what the panel rendered (agent/src/impress_a/analysis/mock_figures.py).
#   unparseable  a deliberate FASTA fixture value in tests/test_real_toolkits.py, and a valid
#                variant spelling; the toolkit's own fixtures are named unparsed_* to match.
ignore-words-list = "ser,fro,unparseable"
skip = """
.git,
.github,
__pycache__,
build,
dist,
.*egg-info
"""